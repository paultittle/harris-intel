name: Scrape Harris County Motivated Seller Leads

on:
  schedule:
    # Runs at 07:00 UTC daily (2 AM CST / 3 AM CDT)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Number of days to look back"
        required: false
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml dbfread playwright

      # ---------------------------------------------------------------
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      # ---------------------------------------------------------------
      - name: Create output directories
        run: |
          mkdir -p dashboard data

      # ---------------------------------------------------------------
      - name: Run scraper
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scraper/fetch.py

      # ---------------------------------------------------------------
      - name: Verify outputs
        run: |
          echo "=== dashboard/records.json ==="
          python -c "
          import json, pathlib
          p = pathlib.Path('dashboard/records.json')
          if p.exists():
              d = json.loads(p.read_text())
              print(f'Total records: {d.get(\"total\", 0)}')
              print(f'With address : {d.get(\"with_address\", 0)}')
              print(f'Fetched at   : {d.get(\"fetched_at\", \"?\")}')
          else:
              print('File not found!')
          "

      # ---------------------------------------------------------------
      - name: Commit and push records
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json data/ghl_export.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update lead records $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

  # -----------------------------------------------------------------
  deploy-dashboard:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # use the latest commit after scrape job push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
